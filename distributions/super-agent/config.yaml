# config.yaml — MERQATO Super Agent configuration

# NATIVE HERMES FIELDS ONLY.
# This file is a valid Hermes profile config.yaml. It is installed
# into the customer's profile directory by `hermes profile install`.
#
# MERQATO plan enforcement (plan:, limits:, tools:, skills:) is
# handled by the MERQATO control layer, not by Hermes directly.
# See SOUL.md for plan concepts and runtime boundaries.

model:
  default: "openrouter/anthropic/claude-sonnet-4"
  provider: openrouter
  # Local plan: override provider to ollama, set OLLAMA_HOST
  # BYOK plan: customer provides OPENROUTER_API_KEY in .env
  # Cloud plan: MERQATO supplies model routing

agent:
  max_turns: 150
  reasoning_effort: low

display:
  streaming: true
  show_reasoning: false

memory:
  memory_enabled: true

# ── MERQATO PLAN NOTE ──────────────────────────────────────────────
# The following concepts are enforced by the MERQATO control layer,
# NOT by this config file. Hermes does not interpret these keys at
# install or runtime. They are documented here so the installer can
# read the plan intent, but they are not functional Hermes config.
#
# plan: solo
# limits:
#   active_bots: 1
#   parallel_delegations: 0
#   group_chat: false
#   bot_to_bot: false
#   scheduled_routines: 3
#   monthly_token_budget: customer_selected
#   per_task_token_limit: customer_selected
#   reasoning_level: low
#   premium_models: false
#
# tools: Hermes enables tools via toolset resolution at runtime.
#   Default toolset for this distribution: file, terminal, browser,
#   web_search, web_extract, memory, skills, session_search, cron.
#
# skills: Hermes skills are loaded from the skills/ directory and
#   the Hermes skills catalog. They are not configured via config.yaml.
#   Bundled skills for this distribution:
#     - business-operator
#     - research
#     - marketing
#     - coding
#     - reporting
